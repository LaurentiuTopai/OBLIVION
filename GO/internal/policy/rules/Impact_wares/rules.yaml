- id: "impact-crypto-stratum-ports"
  name: "Outbound connection to cryptomining Stratum pool port"
  mitre: "T1496"
  severity: 4
  events: ["socket_connect"]
  dst_ports: [3333, 4444, 5555, 7777, 8888, 9999, 14444, 14433, 45700]
  external_ip: true

- id: "impact-crypto-xmrig-exec"
  name: "Known cryptocurrency miner binary executed"
  mitre: "T1496"
  severity: 4
  events: ["exec"]
  comms: ["xmrig", "xmrig-mo", "minerd", "cpuminer", "ethminer", "t-rex", "phoenixminer", "nbminer", "lolminer", "gminer"]

- id: "impact-wiper-tmp-mass-unlink"
  name: "Process launched from /tmp is performing mass file deletion"
  mitre: "T1485"
  severity: 5
  events: ["inode_unlink"]
  from_tmp: true
  not_comms: ["dpkg", "apt", "npm", "pip", "pip3", "make", "cmake"]
